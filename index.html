function draw(){const q=current.questions[index];app.innerHTML=`<div class="nav"><button class="smallbtn" onclick="home()">← Übersicht</button><span class="muted">${index+1} / ${current.questions.length}</span></div><div class="card"><div class="eyebrow">${current.icon} ${esc(current.title)} · ${stage==='learn'?'1. Lernen':'2. Schreiben'}</div><div class="progress"><div class="bar" style="width:${100*(index+1)/current.questions.length}%"></div></div>${stage==='learn'?`<h2>📖 Erst lernen</h2><p>${esc(q.ask)}</p><div class="feedback ok"><h2>${esc(q.model)}</h2><p><b>Deutsch:</b> ${esc(q.de)}</p><p><b>🗣️ Aussprache:</b> ${esc(q.pron||'')}</p><p>💡 ${esc(q.explain||'')}</p></div><button class="btn secondary" onclick="speak(current.questions[index].model)">🔊 Satz anhören (freiwillig)</button><p class="muted">Lies den Satz in Ruhe. Danach schreibst du ihn selbst. Anhören ist freiwillig – du musst nicht sprechen.</p><button class="btn" onclick="stage='practice';draw()">Jetzt schreiben →</button>`:`<h2>✍️ Jetzt schreiben</h2><p>${esc(q.ask)}</p><p class="muted">Versuche, den englischen Satz aus dem Gedächtnis zu schreiben.</p><button class="smallbtn" onclick="toggleHint()">💡 ${showHint?'Hilfe ausblenden':'Kleine Hilfe anzeigen'}</button>${showHint?`<p class="muted">${esc(q.hint)}</p>`:''}<label for="answer" class="eyebrow" style="display:block;margin-top:22px">Deine Antwort</label><input id="answer" class="answer" autocomplete="off" autocapitalize="sentences" placeholder="Schreibe deinen englischen Satz …"><button class="btn" onclick="checkAnswer()">Antwort überprüfen</button><div id="feedback" aria-live="polite"></div><button class="btn ghost" onclick="stage='learn';draw()">← Noch einmal lernen</button>`}</div><button class="btn secondary" onclick="nextQuestion()">${index===current.questions.length-1?'Zur Übersicht':'Nächster Satz →'}</button><button class="btn ghost" onclick="previousQuestion()">← Vorheriger Satz</button>`;const a=document.getElementById('answer');if(a)a.ad
